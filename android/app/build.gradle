apply plugin: 'com.android.application'

// 서명 열쇠와 비밀번호는 저장소에 두지 않는다. android/keystore.properties 에
// 적거나 환경변수로 준다 — 둘 다 .gitignore 에 걸려 있다.
//
//   android/keystore.properties
//     storeFile=../../android-build/android.keystore
//     storePassword=…
//     keyAlias=flipflap
//     keyPassword=…
//
// 값이 없으면 서명 설정을 아예 안 만든다. 그래야 debug 빌드는 그냥 되고,
// release 빌드는 "서명이 없다" 고 분명히 말하며 멈춘다.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ksPath  = ksProps['storeFile']     ?: System.getenv('FF_KEYSTORE')
def ksPass  = ksProps['storePassword'] ?: System.getenv('FF_KEYSTORE_PASSWORD')
def ksAlias = ksProps['keyAlias']      ?: System.getenv('FF_KEY_ALIAS') ?: 'flipflap'
def ksKey   = ksProps['keyPassword']   ?: System.getenv('FF_KEY_PASSWORD') ?: ksPass
def canSign = ksPath && ksPass && file(ksPath).exists()

android {
    namespace = "com.mongdung.flipflap"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mongdung.flipflap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5          // TWA 가 4 까지 썼다. 스토어는 늘 더 큰 번호만 받는다.
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (canSign) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKey
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSign) signingConfig signingConfigs.release
        }
    }
}

// 열쇠가 없는데 release 를 부르면 여기서 멈춘다.
// 안 막으면 그래들은 "성공" 이라 말하며 서명 없는 AAB 를 뱉고,
// 그걸 올리면 스토어가 알아듣기 힘든 말로 되돌려 보낸다.
if (!canSign && gradle.startParameter.taskNames.any { it =~ /(?i)(bundle|assemble|install)Release/ }) {
    def why = !ksPath ? "android/keystore.properties 가 없다 (keystore.properties.example 을 복사해 채운다)"
            : !file(ksPath).exists() ? "storeFile 이 가리키는 곳에 열쇠가 없다 — ${file(ksPath).absolutePath}"
            : "storePassword 가 비었다"
    throw new GradleException(
        "\n\n  서명 열쇠가 없어 release 를 만들지 않는다.\n" +
        "  ${why}\n\n" +
        "  열쇠는 TWA 때 쓰던 그것이어야 한다. 새로 만들면 스토어가 거절한다.\n" +
        "  시험만 할 거면:  ./gradlew assembleDebug\n")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
