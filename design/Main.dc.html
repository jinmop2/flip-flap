<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap">
  <style>
    body { margin:0; font-family:'Fredoka',system-ui,sans-serif; background:#180509; }
    a { color:#e8c98a; text-decoration:none; } a:hover { color:#ffe9a8; }
    .ff, .ff * { box-sizing:border-box; }
    .ff button { font-family:'Fredoka'; cursor:pointer; border:none; background:none; color:inherit; padding:0; }
    .ff svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

    /* 버건디 가죽 — 프랙탈 노이즈 결 위에 스포트라이트 */
    .ff-bg {
      background-color:#180509;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/><feColorMatrix type='matrix' values='0 0 0 0 0.32 0 0 0 0 0.09 0 0 0 0 0.11 0 0 0 0.32 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"),
        radial-gradient(ellipse 130% 95% at 50% 26%, #5a1220 0%, #300a12 55%, #120306 100%);
    }
    /* 무늬 한 겹 — 카드 문양을 아주 옅게 깔아 빈 자리가 '비어 보이지' 않게 한다.
       무엇을 읽는 자리가 아니므로 3% 를 넘기지 않는다. */
    .ff-weave {
      position:absolute; inset:0; pointer-events:none; opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='58' height='58'><g fill='%23f5cf6e'><path d='M14 8c0 0-4 4.2-4 6.4 0 1.5 1.5 2.4 3 1.8l-.7 2.8h3.4l-.7-2.8c1.5.6 3-.3 3-1.8C18 12.2 14 8 14 8z'/><path d='M44 38l3.4 3.4L44 44.8l-3.4-3.4z'/></g></svg>");
    }
    /* 가장자리 그늘 — 빛이 가운데로 떨어지는 느낌. 판 위에 얹히지만 손가락은 통과한다. */
    .ff-vig { position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 78% 58% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.42) 100%); }

    /* 로고 — FLAP 은 뒤집혀 붙는다(게임 이름 그대로) */
    .ff .lg h1, .ff .lg .flap {
      margin:0; font-family:'Bangers',cursive; font-size:3.55rem; letter-spacing:3.5px; line-height:.9;
      background:linear-gradient(180deg,#fff3c8 0%,#f5cf6e 38%,#c8912e 62%,#8a5a12 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 1px 0 #6a4210) drop-shadow(0 2px 0 #4a2c08)
             drop-shadow(0 4px 6px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,200,90,.34));
    }
    .ff .lg .flap { transform:rotate(180deg); display:inline-block; opacity:.92; }
    /* 로고 아래 마감 줄 — 가운데 마름모가 로고와 아래 내용을 갈라 준다 */
    .ff .rule { display:flex; align-items:center; gap:10px; width:172px; margin:13px auto 0; }
    .ff .rule span { flex:1; height:1.5px; border-radius:1px;
      background:linear-gradient(90deg,transparent,rgba(224,180,92,.85),transparent); }
    .ff .rule i { width:8px; height:8px; flex-shrink:0; transform:rotate(45deg);
      background:linear-gradient(135deg,#ffe9a8,#c8912e);
      box-shadow:0 0 12px rgba(255,215,120,.7), 0 1px 2px rgba(0,0,0,.5); }

    /* 배우기 — 가죽 태그에 점선 스티치. 가로로 눕혀 부수적인 자리로 낮춘다. */
    .ff .top-link { position:relative; transition:.15s; }
    .ff .top-link::after { content:''; position:absolute; inset:3px; border-radius:8px;
      border:1px dashed rgba(245,207,110,.32); pointer-events:none; }
    .ff .top-link:hover { filter:brightness(1.12); }

    /* 모드 카드 — 가죽 케이스 안에 펠트 판이 깔린 모양.
       예전엔 색만 다른 네모였다. 이 게임은 판 위에서 노는 게임인데
       로비에 판이 한 조각도 안 보였다. */
    .ff .mode-card { transition:.17s; position:relative; }
    .ff .mode-card:hover { transform:translateY(-3px); filter:brightness(1.07); }
    .ff .mode-card:hover .felt { box-shadow:inset 0 3px 18px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,215,120,.3); }
    .ff .felt { position:relative; flex:1; width:100%; border-radius:13px; display:flex;
      flex-direction:column; align-items:center; justify-content:center; gap:7px;
      box-shadow:inset 0 3px 18px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,215,120,.16);
      transition:.17s; }

    .ff .mm-tile, .ff .mm-hero { transition:.14s; }
    .ff .mm-tile:hover, .ff .mm-hero:hover { filter:brightness(1.1); }
    .ff .misc { transition:.14s; color:#8a7a80; }
    .ff .misc:hover { color:#e8c98a; }

    /* 모드 칸 — 겉면과 난이도를 겹쳐 두고 서로 넘긴다. 칸은 62px 그대로 있고
       안에 든 것만 갈아 끼운다. 아래로 밀어내면 눌렀던 자리가 움직여
       다른 모드가 따라 내려간다. */
    .ff .sm-item { position:relative; width:100%; height:62px; border-radius:14px; }
    .ff .sm-head, .ff .sm-body { position:absolute; inset:0; border-radius:14px;
      transition:opacity .2s ease, transform .24s cubic-bezier(.34,1.3,.64,1); }
    .ff .sm-head { display:flex; align-items:center; gap:11px; text-align:left; padding:0 13px;
      opacity:1; transform:none; pointer-events:auto; }
    .ff .sm-body { display:flex; align-items:center; gap:6px; padding:5px;
      background:rgba(0,0,0,.32); box-shadow:inset 0 1px 0 rgba(255,215,120,.12);
      opacity:0; transform:translateY(7px) scale(.97); pointer-events:none; }
    .ff .sm-list[data-open="classic"] [data-m="classic"] .sm-head,
    .ff .sm-list[data-open="item"]    [data-m="item"]    .sm-head,
    .ff .sm-list[data-open="twelve"]  [data-m="twelve"]  .sm-head,
    .ff .sm-list[data-open="quad"]    [data-m="quad"]    .sm-head,
    .ff .sm-list[data-open="mini"]    [data-m="mini"]    .sm-head,
    .ff .sm-list[data-open="tour"]    [data-m="tour"]    .sm-head {
      opacity:0; transform:translateY(-7px) scale(.97); pointer-events:none; }
    .ff .sm-list[data-open="classic"] [data-m="classic"] .sm-body,
    .ff .sm-list[data-open="item"]    [data-m="item"]    .sm-body,
    .ff .sm-list[data-open="twelve"]  [data-m="twelve"]  .sm-body,
    .ff .sm-list[data-open="quad"]    [data-m="quad"]    .sm-body,
    .ff .sm-list[data-open="mini"]    [data-m="mini"]    .sm-body,
    .ff .sm-list[data-open="tour"]    [data-m="tour"]    .sm-body {
      opacity:1; transform:none; pointer-events:auto; }
    .ff .sm-head:hover { filter:brightness(1.13); }
    /* 모드 색이 칸 안쪽에서 한 번 더 번진다 — 색만 다른 네모가 아니게 */
    .ff .sm-glow { position:absolute; inset:0; border-radius:14px; pointer-events:none; opacity:.5; }

    .ff .dbtn { display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2px 4px; border-radius:10px; height:100%; overflow:hidden;
      background:linear-gradient(180deg,#3a1018,#260a10);
      box-shadow:inset 0 1px 0 rgba(255,215,120,.16); }
    .ff .dbtn:hover { filter:brightness(1.14); }
    .ff .dbtn i { font-style:normal; font-size:.84rem; line-height:1.15; color:#ffd479; letter-spacing:1px; }
    .ff .dbtn b { font-size:.76rem; line-height:1.25; font-weight:700; color:#e8c98a; }
    .ff .dbtn s { text-decoration:none; font-size:.55rem; line-height:1.2; color:#a89880; }
    .ff .back { flex-shrink:0; width:26px; align-self:stretch; border-radius:9px;
      background:rgba(0,0,0,.35); border:1px solid rgba(200,160,0,.3); color:#c8a86a;
      font-size:.9rem; line-height:1; }
    .ff .back:hover { color:#ffe9a8; border-color:#c8a000; }

    .ff .panel { animation:ffUp .3s cubic-bezier(.34,1.4,.64,1); }
    @keyframes ffUp { from { opacity:0; transform:translateY(14px) scale(.97); } }
    .ff .veil { animation:ffFade .25s; }
    @keyframes ffFade { from { opacity:0; } }
    .ff .sec { display:flex; align-items:center; gap:8px; }
    .ff .sec b { font-size:.72rem; font-weight:800; color:#c8a86a; letter-spacing:.6px; white-space:nowrap; }
    .ff .sec i { flex:1; height:1px; background:linear-gradient(90deg, rgba(185,141,52,.45), transparent); }
  </style>
</helmet>

<script data-dc-script data-props='{
  "start": {"editor":"enum","options":["lobby","solo","multi"],"default":"lobby","section":"여는 화면"},
  "gold": {"editor":"color","default":"#c99a3a","options":["#c99a3a","#c8a000","#8a7a80","#c1272d"],"section":"색"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  renderVals() {
    // 생성자를 두지 않는다 — 상태가 아직 없을 때도 첫 그리기가 되어야 한다
    const st = this.state || {};
    const screen = st.screen ?? (this.props.start ?? 'lobby');
    const go = (s) => () => this.setState({ screen: s, open: null });
    // 한 칸만 열린다. 같은 칸을 다시 누르면 겉면이 도로 덮인다.
    const pick = (m) => () => this.setState({ open: st.open === m ? null : m });
    return {
      gold: this.props.gold ?? '#c99a3a',
      open: st.open ?? '',
      isSolo: screen === 'solo',
      isMulti: screen === 'multi',
      goSolo: go('solo'),
      goMulti: go('multi'),
      goLobby: go('lobby'),
      close: () => this.setState({ open: null }),
      // 패널 안을 눌렀을 때 뒤쪽 덮개까지 눌리지 않게
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      pickClassic: pick('classic'),
      pickItem: pick('item'),
      pickTwelve: pick('twelve'),
      pickQuad: pick('quad'),
      pickMini: pick('mini'),
      pickTour: pick('tour'),
    };
  }
}
</script>
