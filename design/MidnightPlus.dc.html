<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap">
  <style>
    body { margin:0; font-family:'Fredoka',system-ui,sans-serif; background:#05080f; }
    a { color:#9fb4d8; text-decoration:none; } a:hover { color:#e4ecf8; }
    .ff, .ff * { box-sizing:border-box; }
    .ff button { font-family:'Fredoka'; cursor:pointer; border:none; background:none; color:inherit; padding:0; }
    .ff svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

    .ff-bg {
      background-color:#05080f;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/><feColorMatrix type='matrix' values='0 0 0 0 0.12 0 0 0 0 0.16 0 0 0 0 0.26 0 0 0 0.32 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"),
        radial-gradient(ellipse 130% 95% at 50% 26%, #17253f 0%, #0a1020 55%, #03060c 100%);
    }
    .ff-weave { position:absolute; inset:0; pointer-events:none; opacity:.05;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='58' height='58'><g fill='%23a8c0e8'><path d='M14 8c0 0-4 4.2-4 6.4 0 1.5 1.5 2.4 3 1.8l-.7 2.8h3.4l-.7-2.8c1.5.6 3-.3 3-1.8C18 12.2 14 8 14 8z'/><path d='M44 38l3.4 3.4L44 44.8l-3.4-3.4z'/></g></svg>"); }
    .ff-vig { position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 78% 58% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 100%); }

    /* ── 들어올 때 한 번. 흩어진 잔재주 대신 한 번에 짜인 등장. ── */
    .ff .rise { animation:ffRise .5s cubic-bezier(.22,.9,.3,1) both; }
    @keyframes ffRise { from { opacity:0; transform:translateY(16px); } }
    .ff .drop { animation:ffDrop .45s cubic-bezier(.22,.9,.3,1) both; }
    @keyframes ffDrop { from { opacity:0; transform:translateY(-100%); } }
    .ff .up { animation:ffUp2 .45s cubic-bezier(.22,.9,.3,1) both; }
    @keyframes ffUp2 { from { opacity:0; transform:translateY(100%); } }
    /* FLAP 은 뒤집혀 붙는 글자다 — 게임 이름 그대로 한 번 뒤집으며 앉는다 */
    .ff .lg .flap { animation:ffFlip .72s cubic-bezier(.3,1.1,.4,1) both; animation-delay:.22s; }
    @keyframes ffFlip {
      from { opacity:0; transform:rotate(180deg) rotateX(88deg) translateY(-10px); }
      to   { opacity:.92; transform:rotate(180deg) rotateX(0) translateY(0); } }
    @media (prefers-reduced-motion:reduce) {
      .ff .rise, .ff .drop, .ff .up, .ff .lg .flap { animation:none !important; opacity:1; transform:none; }
      .ff .lg .flap { transform:rotate(180deg); opacity:.92; } }

    .ff .lg h1, .ff .lg .flap {
      margin:0; font-family:'Bangers',cursive; font-size:3.55rem; letter-spacing:3.5px; line-height:.9;
      background:linear-gradient(180deg, #ffffff 0%, #d8e4f8 38%, #93a8cc 62%, #4e5e7e 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 1px 0 #2a3450) drop-shadow(0 2px 0 #1a2438)
             drop-shadow(0 4px 6px rgba(0,0,0,.4)) drop-shadow(0 0 18px rgba(170,205,255,.34)); }
    .ff .lg .flap { transform:rotate(180deg); display:inline-block; opacity:.92; }
    .ff .lg { perspective:600px; }
    .ff .rule { display:flex; align-items:center; gap:10px; width:172px; margin:13px auto 0; }
    .ff .rule span { flex:1; height:1.5px; border-radius:1px;
      background:linear-gradient(90deg,transparent,#9fb4d8,transparent); }
    .ff .rule i { width:8px; height:8px; flex-shrink:0; transform:rotate(45deg); background:#9fb4d8;
      box-shadow:0 0 12px rgba(200,225,255,.32), 0 1px 2px rgba(0,0,0,.35); }

    .ff .top-link { position:relative; transition:.15s; }
    .ff .top-link::after { content:''; position:absolute; inset:3px; border-radius:8px;
      border:1px dashed #9fb4d8; opacity:.5; pointer-events:none; }
    .ff .top-link:hover { filter:brightness(1.08); }

    .ff .mode-card { transition:.17s; position:relative; }
    .ff .mode-card::after { content:''; position:absolute; inset:5px; border-radius:14px;
      border:1.5px dashed #9fb4d8; opacity:.5; pointer-events:none; }
    .ff .mode-card:hover { transform:translateY(-3px); filter:brightness(1.06); }
    .ff .mode-card:hover .seat { opacity:.95; }

    /* 펠트는 색면이 아니라 판이다. 가장자리에 앉은 자리를 두면
       "혼자 하나 / 여럿이 하나" 가 라벨을 읽기 전에 보인다. */
    .ff .felt { position:relative; flex:1; width:100%; border-radius:13px; display:flex;
      flex-direction:column; align-items:center; justify-content:center; gap:7px; overflow:hidden;
      box-shadow:inset 0 3px 18px rgba(0,0,0,.62), inset 0 0 0 1px rgba(200,225,255,.32); }
    /* 판 위로 떨어지는 빛 — 가운데가 밝고 가장자리가 어둡다 */
    .ff .felt::before { content:''; position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 62% 46% at 50% 40%, rgba(255,255,255,.09), transparent 70%); }
    .ff .seat { position:absolute; border-radius:999px; background:rgba(200,225,255,.55);
      box-shadow:0 0 8px rgba(200,225,255,.35); opacity:.72; transition:.17s; }
    .ff .seat.h { width:26px; height:5px; left:50%; margin-left:-13px; }
    .ff .seat.v { width:5px; height:26px; top:50%; margin-top:-13px; }
    .ff .seat.me { background:#e4ecf8; opacity:.95; box-shadow:0 0 12px rgba(220,238,255,.7); }

    .ff .misc { transition:.14s; color:#8fa0bc; }
    .ff .misc:hover { color:#9fb4d8; }
  </style>
</helmet>

<div class="ff ff-bg" style="position:relative; width:390px; height:844px; overflow:hidden;
  color:#e4ecf8; display:flex; flex-direction:column;">
  <div class="ff-weave"></div>
  <div class="ff-vig"></div>

  <div class="drop" style="position:relative; z-index:2; flex-shrink:0; display:flex; flex-direction:column;
    overflow:hidden; background:linear-gradient(180deg, #182240 0%, #090e1c 100%);
    border-radius:0 0 18px 18px; box-shadow:0 6px 18px rgba(0,0,0,.4);">
    <div style="display:flex; align-items:center; gap:11px; padding:12px 15px 13px;">
      <div style="width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex;
        align-items:center; justify-content:center; color:#9fb4d8;
        background:linear-gradient(160deg, #243350 0%, #141c30 100%); border:2px solid #9fb4d8;">
        <svg viewBox="0 0 24 24" style="width:21px; height:21px;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:.98rem; font-weight:800; color:#e4ecf8; line-height:1.25;">게스트9063</div>
        <div style="font-size:.66rem; color:#8fa0bc; line-height:1.35;">게스트 · 기록이 저장되지 않아요</div>
      </div>
      <button style="min-height:44px; padding:0 16px; border-radius:999px; font-size:.79rem;
        font-weight:700; color:#e4ecf8; background:linear-gradient(180deg, #1c2740 0%, #0e1626 100%);
        border:1.5px solid #9fb4d8;">로그인</button>
      <button title="설정" style="width:44px; height:44px; border-radius:12px; color:#9fb4d8;
        display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg viewBox="0 0 24 24" style="width:19px; height:19px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <div style="height:5px; background:rgba(0,0,0,.28); overflow:hidden;">
      <div style="height:100%; width:34%; background:#9fb4d8;"></div>
    </div>
  </div>

  <div style="position:relative; z-index:2; flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:23px; padding:6px 23px 10px;">

    <div class="lg rise" style="text-align:center; animation-delay:.06s;">
      <h1>FLIP</h1><div class="flap">FLAP</div>
      <div class="rule"><span></span><i></i><span></span></div>
    </div>

    <div class="rise" style="display:flex; gap:8px; width:100%; animation-delay:.16s;">
      <button class="top-link" style="flex:1; min-width:0; min-height:44px; display:flex;
        align-items:center; justify-content:center; gap:7px; padding:0 8px; border-radius:12px;
        font-size:.76rem; font-weight:700; background:linear-gradient(180deg, #1c2740 0%, #0e1626 100%);
        border:1.5px solid #9fb4d8; color:#c4d4ee; box-shadow:0 2px 6px rgba(0,0,0,.45);">
        <svg viewBox="0 0 24 24" style="width:17px; height:17px; flex-shrink:0;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        게임방법
      </button>
      <button class="top-link" style="flex:1; min-width:0; min-height:44px; display:flex;
        align-items:center; justify-content:center; gap:7px; padding:0 8px; border-radius:12px;
        font-size:.76rem; font-weight:700; background:linear-gradient(180deg, #1c2740 0%, #0e1626 100%);
        border:1.5px solid #9fb4d8; color:#c4d4ee; box-shadow:0 2px 6px rgba(0,0,0,.45);">
        <svg viewBox="0 0 24 24" style="width:17px; height:17px; flex-shrink:0;"><path d="M22 10 12 5 2 10l10 5z"></path><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"></path><path d="M22 10v6"></path></svg>
        튜토리얼
      </button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; width:100%;">
      <!-- 솔로 — 마주 앉은 두 자리. 아래가 나. -->
      <button class="mode-card rise" style="height:216px; display:flex; padding:7px; border-radius:20px;
        border:2.5px solid #9fb4d8; background:linear-gradient(180deg, #182240 0%, #0a1020 100%);
        box-shadow:inset 0 1px 0 rgba(200,225,255,.32), 0 6px 18px rgba(0,0,0,.4); animation-delay:.26s;">
        <span class="felt" style="background:radial-gradient(ellipse at 50% 32%, {{feltS}});">
          <sc-if value="{{ seats }}" hint-placeholder-val="{{ true }}">
            <i class="seat h" style="top:9px;"></i>
            <i class="seat h me" style="bottom:9px;"></i>
          </sc-if>
          <svg viewBox="0 0 48 48" style="position:relative; width:52px; height:52px; stroke:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));">
            <rect x="13" y="7" width="22" height="32" rx="4.5" fill="#f7d98a" stroke="#7a4e10" stroke-width="2"></rect>
            <path d="M24 13C24 13 17 20 17 24.5c0 2.7 2.7 4.3 5.5 3.1L21.3 33h5.4l-1.2-5.4c2.8 1.2 5.5-.4 5.5-3.1C31 20 24 13 24 13Z" fill="#2a0a10"></path>
          </svg>
          <span style="position:relative; font-size:1.14rem; font-weight:800; color:#f7ecd0;
            letter-spacing:.6px; text-shadow:0 1px 3px rgba(0,0,0,.7);">솔로플레이</span>
          <span style="position:relative; font-size:.68rem; color:#bfe0cc; opacity:.9;">AI와 대전</span>
        </span>
      </button>
      <!-- 멀티 — 판을 둘러앉은 네 자리 -->
      <button class="mode-card rise" style="height:216px; display:flex; padding:7px; border-radius:20px;
        border:2.5px solid #9fb4d8; background:linear-gradient(180deg, #182240 0%, #0a1020 100%);
        box-shadow:inset 0 1px 0 rgba(200,225,255,.32), 0 6px 18px rgba(0,0,0,.4); animation-delay:.34s;">
        <span class="felt" style="background:radial-gradient(ellipse at 50% 32%, {{feltM}});">
          <sc-if value="{{ seats }}" hint-placeholder-val="{{ true }}">
            <i class="seat h" style="top:9px;"></i>
            <i class="seat v" style="left:9px;"></i>
            <i class="seat v" style="right:9px;"></i>
            <i class="seat h me" style="bottom:9px;"></i>
          </sc-if>
          <svg viewBox="0 0 48 48" style="position:relative; width:52px; height:52px; stroke:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));">
            <g transform="rotate(-16 24 25)"><rect x="7" y="9" width="19" height="29" rx="4" fill="#c99a3a" stroke="#7a4e10" stroke-width="2"></rect></g>
            <g transform="rotate(16 24 25)"><rect x="22" y="9" width="19" height="29" rx="4" fill="#f7d98a" stroke="#7a4e10" stroke-width="2"></rect>
              <path d="M31.5 15s-5.8 5.8-5.8 9.5c0 2.1 2.1 3.4 4.2 2.4l-1 4.4h5.2l-1-4.4c2.1 1 4.2-.3 4.2-2.4 0-3.7-5.8-9.5-5.8-9.5Z" fill="#2a0a10"></path></g>
          </svg>
          <span style="position:relative; font-size:1.14rem; font-weight:800; color:#f7ecd0;
            letter-spacing:.6px; text-shadow:0 1px 3px rgba(0,0,0,.7);">멀티플레이</span>
          <span style="position:relative; font-size:.68rem; color:#c2d6f0; opacity:.9;">온라인 대전</span>
        </span>
      </button>
    </div>

    <div class="rise" style="display:flex; gap:4px; width:100%; justify-content:center; animation-delay:.42s;">
      <button class="misc" style="flex:1; min-height:44px; display:flex; align-items:center;
        justify-content:center; gap:5px; font-size:.66rem; font-weight:600; border-radius:11px;">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        친구 초대
      </button>
      <button class="misc" style="flex:1; min-height:44px; display:flex; align-items:center;
        justify-content:center; gap:5px; font-size:.66rem; font-weight:600; border-radius:11px;">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
        앱으로 추가
      </button>
      <button class="misc" style="flex:1; min-height:44px; display:flex; align-items:center;
        justify-content:center; gap:5px; font-size:.66rem; font-weight:600; border-radius:11px;">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        버그 제보
      </button>
    </div>
  </div>

  <div class="up" style="position:relative; z-index:2; flex-shrink:0; display:flex; padding:6px 4px;
    background:linear-gradient(180deg, #182240 0%, #090e1c 100%);
    border-radius:18px 18px 0 0; box-shadow:0 -6px 18px rgba(0,0,0,.4);">
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700;
      color:#e4ecf8; background:rgba(159,180,216,.18);">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>홈
    </button>
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700; color:#8fa0bc;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.4"></circle></svg>미션
    </button>
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700; color:#8fa0bc;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"></path></svg>상점
    </button>
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700; color:#8fa0bc;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><circle cx="9" cy="8" r="3.4"></circle><path d="M2 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"></path><path d="M17 8.5a3 3 0 0 1 0 5.4"></path><path d="M19 20c0-2.6-1-4.2-2.6-5"></path></svg>친구
    </button>
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700; color:#8fa0bc;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"></path></svg>클랜
    </button>
    <button style="flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; border-radius:12px; font-size:.62rem; font-weight:700; color:#8fa0bc;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><path d="M7 4h10v6a5 5 0 0 1-10 0z"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4"></path><path d="M17 6h2.5a2.5 2.5 0 0 1-2.5 4"></path><path d="M10 20h4M12 15v5"></path></svg>랭킹
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "felt": {"editor":"enum","options":["A 청옥·감청","B 은녹·강청","C 청록·포도"],"default":"B 은녹·강청","section":"펠트"},
  "seats": {"editor":"boolean","default":true,"section":"펠트"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  renderVals() {
    // 펠트 짝은 고르는 중이라 칩으로 남겨 둔다 — 개선안 위에서 바로 비교할 수 있게.
    const F = {
      'A 청옥·감청': ['#2c7f72 0%, #154a41 62%, #0a2823 100%', '#2f74b8 0%, #17457a 62%, #0b2444 100%'],
      'B 은녹·강청': ['#4a7d72 0%, #2c4f47 62%, #182c28 100%', '#4a6e9e 0%, #2c4468 62%, #18263c 100%'],
      'C 청록·포도': ['#1d7a72 0%, #0f4741 62%, #082623 100%', '#7d5eb6 0%, #48327a 62%, #271a42 100%'],
    };
    const pick = F[this.props.felt] || F['B 은녹·강청'];
    return { feltS: pick[0], feltM: pick[1], seats: this.props.seats ?? true };
  }
}
</script>
</body>
</html>
